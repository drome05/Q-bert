apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: chat
spec:
  replicas: 1   # a fun feature, not worth redundancy -- and only one Ollama instance to call anyway
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/drome05/chat-service:27b69d6f5c86da14ae118b3f1d5d3b909443ba18
          imagePullPolicy: IfNotPresent
          env:
            # Ollama runs natively on this same EC2 host, outside k3s --
            # plain containerd/k3s on Linux has no host.docker.internal
            # equivalent, so the node's own private IP is used instead.
            # Private IP persists across the scheduled stop/start (only the
            # public IP changes), so this doesn't need updating each cycle.
            - name: OLLAMA_URL
              value: "http://172.31.29.77:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:0.5b"   # smallest reasonable model -- this box has very little memory headroom
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
