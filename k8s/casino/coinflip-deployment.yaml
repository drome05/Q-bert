apiVersion: apps/v1
kind: Deployment
metadata:
  name: coinflip-service
  namespace: casino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coinflip-service
  template:
    metadata:
      labels:
        app: coinflip-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values: ["games"]
      containers:
        - name: coinflip-service
          image: coinflip-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
