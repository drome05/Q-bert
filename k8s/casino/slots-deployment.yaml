apiVersion: apps/v1
kind: Deployment
metadata:
  name: slots-service
  namespace: casino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slots-service
  template:
    metadata:
      labels:
        app: slots-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values: ["games"]
      containers:
        - name: slots-service
          image: slots-service:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
