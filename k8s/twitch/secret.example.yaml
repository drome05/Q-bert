# Placeholder only -- never apply this file directly. Create the real
# secret imperatively instead (optional -- twitch-service runs fine
# without it, Twitch commands just report "not configured" until you add it):
#
#   kubectl create secret generic twitch-secrets -n twitch \
#     --from-literal=TWITCH_CLIENT_ID=xxx \
#     --from-literal=TWITCH_CLIENT_SECRET=xxx
#
apiVersion: v1
kind: Secret
metadata:
  name: twitch-secrets
  namespace: twitch
type: Opaque
stringData:
  TWITCH_CLIENT_ID: "xxx"
  TWITCH_CLIENT_SECRET: "xxx"
