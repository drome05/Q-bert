apiVersion: apps/v1
kind: Deployment
metadata:
  name: inhouse-service
  namespace: inhouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inhouse-service
  template:
    metadata:
      labels:
        app: inhouse-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: tier
                    operator: In
                    values: ["core"]
      containers:
        - name: inhouse-service
          image: inhouse-service:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
